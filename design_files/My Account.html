<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genzee Jewels — My Account redesign</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --cream: #FAF6EF;
    --cream-2: #F2EBDD;
    --ink: #111111;
    --ink-soft: #2A2622;
    --muted: #6F6A60;
    --line: #E6DFCE;
    --magenta: #E91E63;
    --magenta-soft: #FFE3EE;
    --pearl: #FFFFFF;
    --gold: #C9A063;
    --success: #2E7D5B;
  }
  html, body { margin: 0; padding: 0; background: #efe9da; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* Common typography helpers */
  .display { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* Wordmark */
  .wordmark { font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
  .wordmark .pink { color: var(--magenta); }

  /* ============================== Direction A — Editorial Boutique ============================== */
  .ed { background: var(--cream); color: var(--ink); }
  .ed .promo {
    background: #000; color: #fff; font-size: 12px; letter-spacing: 0.02em;
    display: flex; gap: 28px; align-items: center; height: 32px; padding: 0 24px;
    overflow: hidden; white-space: nowrap;
  }
  .ed .promo span { display: inline-flex; align-items: center; gap: 6px; opacity: .9; }
  .ed .promo .dot { width: 3px; height: 3px; background: #666; border-radius: 50%; flex: none; }
  .ed .header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 18px 40px; border-bottom: 1px solid var(--line);
  }
  .ed .nav-left, .ed .nav-right {
    display: flex; gap: 28px; align-items: center; font-size: 13px; color: var(--ink-soft);
  }
  .ed .nav-right { justify-content: flex-end; }
  .ed .search {
    background: var(--cream-2); border: none; padding: 10px 14px; border-radius: 999px;
    font-size: 13px; width: 220px; color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .ed .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; }
  .ed .icon-btn:hover { background: var(--cream-2); }
  .ed .bag-dot { position: relative; }
  .ed .bag-dot::after { content: '2'; position: absolute; top: -2px; right: -2px; background: var(--magenta); color: #fff; font-size: 10px; font-weight: 600; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  .ed .layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; min-height: 1200px; }

  /* Sidebar */
  .ed .sidebar {
    border-right: 1px solid var(--line); padding: 48px 32px;
    background: linear-gradient(180deg, var(--cream) 0%, #f6efde 100%);
  }
  .ed .side-greeting { padding-bottom: 28px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
  .ed .side-greeting .label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .ed .side-greeting .name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px; line-height: 1.1; margin-top: 6px; letter-spacing: -0.01em; }
  .ed .tier {
    margin-top: 12px; display: inline-flex; align-items: center; gap: 8px;
    background: var(--ink); color: var(--cream); padding: 6px 12px; border-radius: 999px;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .ed .tier .gem { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .ed .nav { display: flex; flex-direction: column; gap: 2px; }
  .ed .nav-item {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px;
    font-size: 14px; color: var(--ink-soft); position: relative;
  }
  .ed .nav-item:hover { background: rgba(0,0,0,0.04); }
  .ed .nav-item.active { background: var(--ink); color: var(--cream); }
  .ed .nav-item .ic { width: 16px; height: 16px; flex: none; }
  .ed .nav-item .badge {
    margin-left: auto; font-size: 11px; background: var(--magenta); color: #fff;
    padding: 1px 7px; border-radius: 999px; font-weight: 600;
  }
  .ed .nav-item.active .badge { background: var(--magenta); }
  .ed .nav-divider { height: 1px; background: var(--line); margin: 14px 6px; }
  .ed .care-card {
    margin-top: 28px; padding: 18px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--pearl);
  }
  .ed .care-card .eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--magenta); font-weight: 600; }
  .ed .care-card h4 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; margin: 6px 0 8px; line-height: 1.2; }
  .ed .care-card p { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .ed .care-card a { font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--ink); padding-bottom: 1px; }

  /* Main */
  .ed .main { padding: 56px 64px; }
  .ed .crumbs { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .ed .crumbs .sep { opacity: .5; }
  .ed .page-title {
    font-family: 'Fraunces', serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.03em;
    margin: 18px 0 8px;
  }
  .ed .page-sub { font-size: 14px; color: var(--muted); max-width: 520px; line-height: 1.5; }

  /* Dashboard hero (active order) */
  .ed .hero-track {
    margin-top: 36px; background: var(--ink); color: var(--cream); border-radius: 20px; overflow: hidden;
    display: grid; grid-template-columns: 1.1fr 1fr;
  }
  .ed .ht-left { padding: 36px 40px; }
  .ed .ht-eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .7; }
  .ed .ht-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 32px; margin: 8px 0 6px; line-height: 1.15; }
  .ed .ht-meta { font-size: 13px; opacity: .7; }
  .ed .ht-steps { display: flex; gap: 0; margin-top: 36px; align-items: center; }
  .ed .ht-step { flex: 1; }
  .ed .ht-step .bar { height: 2px; background: rgba(255,255,255,0.18); position: relative; }
  .ed .ht-step .bar.done { background: var(--magenta); }
  .ed .ht-step .bar.current::after { content: ''; position: absolute; right: 0; top: -4px; width: 10px; height: 10px; background: var(--magenta); border-radius: 50%; }
  .ed .ht-step .lbl { font-size: 11px; margin-top: 12px; letter-spacing: 0.04em; opacity: .8; }
  .ed .ht-step.active .lbl { opacity: 1; color: var(--magenta); }
  .ed .ht-cta { display: inline-flex; gap: 12px; margin-top: 36px; }
  .ed .btn { padding: 12px 22px; border-radius: 999px; border: 1px solid transparent; font-size: 13px; font-weight: 500; }
  .ed .btn-primary { background: var(--magenta); color: #fff; }
  .ed .btn-ghost-light { background: transparent; color: #fff; border-color: rgba(255,255,255,0.25); }
  .ed .ht-right {
    background: linear-gradient(135deg, #2a2622 0%, #1a1612 100%);
    display: flex; align-items: center; justify-content: center; padding: 36px;
    position: relative;
  }
  .ed .product-frame {
    width: 280px; aspect-ratio: 1; background: #f0e8d4;
    background-image: repeating-linear-gradient(45deg, #e6dec8 0 8px, #f0e8d4 8px 16px);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 11px;
  }
  .ed .ht-right .stamp {
    position: absolute; top: 24px; right: 24px; background: var(--magenta);
    color: #fff; font-size: 10px; letter-spacing: 0.12em; padding: 6px 10px; border-radius: 999px;
    text-transform: uppercase; font-weight: 600;
  }

  /* Stats row */
  .ed .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
  .ed .stat {
    background: var(--pearl); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px;
  }
  .ed .stat .lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .ed .stat .val { font-family: 'Fraunces', serif; font-weight: 500; font-size: 36px; margin-top: 8px; line-height: 1; letter-spacing: -0.02em; }
  .ed .stat .delta { font-size: 12px; color: var(--success); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
  .ed .stat .delta.neg { color: var(--magenta); }

  /* Section heading */
  .ed .sec-head { display: flex; align-items: end; justify-content: space-between; margin: 56px 0 20px; }
  .ed .sec-head h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .ed .sec-head .link { font-size: 12px; color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 1px; font-weight: 500; }

  /* Recent orders */
  .ed .order-list {
    background: var(--pearl); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .ed .order-row {
    display: grid; grid-template-columns: 80px 1.6fr 1fr 1fr 1fr auto; align-items: center;
    padding: 18px 22px; gap: 18px; border-bottom: 1px solid var(--line);
  }
  .ed .order-row:last-child { border-bottom: none; }
  .ed .thumb { width: 64px; height: 64px; border-radius: 10px; background: #f0e8d4;
    background-image: repeating-linear-gradient(45deg, #e6dec8 0 6px, #f0e8d4 6px 12px); }
  .ed .o-name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px; }
  .ed .o-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ed .o-meta-lbl { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .ed .o-meta-val { font-size: 13px; margin-top: 4px; }
  .ed .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 10px; border-radius: 999px; font-weight: 500; }
  .ed .pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .ed .pill.delivered { background: #E8F3EE; color: var(--success); }
  .ed .pill.delivered .dot { background: var(--success); }
  .ed .pill.shipping { background: var(--magenta-soft); color: var(--magenta); }
  .ed .pill.shipping .dot { background: var(--magenta); }
  .ed .pill.processing { background: #F4EFE0; color: #8B6F2A; }
  .ed .pill.processing .dot { background: var(--gold); }
  .ed .row-cta {
    background: transparent; border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px;
    font-size: 12px;
  }
  .ed .row-cta:hover { background: var(--cream); }

  /* Two-column row: addresses + wishlist */
  .ed .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
  .ed .panel {
    background: var(--pearl); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px;
  }
  .ed .panel h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .ed .panel .sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  .ed .addr-card {
    border: 1px dashed var(--line); border-radius: 12px; padding: 18px; margin-bottom: 12px;
    position: relative;
  }
  .ed .addr-card.default { border: 1px solid var(--ink); background: var(--cream); border-style: solid; }
  .ed .addr-tag { position: absolute; top: 12px; right: 12px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--magenta); font-weight: 600; }
  .ed .addr-card .who { font-weight: 600; font-size: 14px; }
  .ed .addr-card .lines { font-size: 13px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .ed .addr-card .actions { margin-top: 12px; display: flex; gap: 14px; font-size: 12px; }
  .ed .addr-card .actions a { border-bottom: 1px solid currentColor; padding-bottom: 1px; }

  .ed .wish-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ed .wish {
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--cream);
  }
  .ed .wish .img { aspect-ratio: 1; background: #f0e8d4;
    background-image: repeating-linear-gradient(45deg, #e6dec8 0 6px, #f0e8d4 6px 12px); }
  .ed .wish .body { padding: 12px 14px; }
  .ed .wish .title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 15px; line-height: 1.2; }
  .ed .wish .price { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }

  /* Loyalty card */
  .ed .loyalty {
    margin-top: 24px; background: var(--ink); color: var(--cream); border-radius: 18px; padding: 32px;
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; position: relative; overflow: hidden;
  }
  .ed .loyalty::before {
    content: ''; position: absolute; top: -80px; right: -80px; width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(233,30,99,0.4) 0%, transparent 70%);
  }
  .ed .loyalty .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .7; }
  .ed .loyalty h3 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 32px; margin: 8px 0 6px; letter-spacing: -0.02em; }
  .ed .loyalty p { font-size: 13px; opacity: .75; margin: 0 0 20px; line-height: 1.5; }
  .ed .progress {
    height: 6px; background: rgba(255,255,255,0.15); border-radius: 999px; overflow: hidden; margin-top: 18px;
  }
  .ed .progress > div { height: 100%; background: var(--magenta); width: 64%; }
  .ed .points-display { text-align: right; }
  .ed .points-num { font-family: 'Fraunces', serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.04em; }
  .ed .points-lbl { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .6; margin-top: 4px; }

  /* ============================== Direction B — Modern Sticker ============================== */
  .st { background: var(--cream); color: var(--ink); }
  .st .promo {
    background: var(--magenta); color: #fff; font-size: 12px;
    display: flex; gap: 24px; align-items: center; height: 36px; padding: 0 24px;
    font-weight: 500; letter-spacing: 0.01em;
  }
  .st .promo .dot { width: 3px; height: 3px; background: #fff; border-radius: 50%; opacity: .6; }
  .st .header {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 32px;
    padding: 16px 32px; background: var(--cream); border-bottom: 2px solid var(--ink);
  }
  .st .nav-top { display: flex; gap: 26px; font-size: 13px; font-weight: 500; }
  .st .nav-top a:hover { color: var(--magenta); }
  .st .header-right { display: flex; align-items: center; gap: 14px; }
  .st .search-box {
    background: #fff; border: 1.5px solid var(--ink); padding: 9px 14px; border-radius: 0;
    font-size: 13px; width: 220px; display: inline-flex; align-items: center; gap: 8px;
  }
  .st .icon-btn { width: 38px; height: 38px; border: 1.5px solid var(--ink); background: #fff; display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .st .icon-btn:hover { background: var(--ink); color: var(--cream); }
  .st .icon-btn .badge { position: absolute; top: -8px; right: -8px; background: var(--magenta); color: #fff; font-size: 10px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--ink); }

  .st .layout { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: 1200px; }
  .st .sidebar {
    border-right: 2px solid var(--ink); padding: 32px 24px; background: var(--cream);
    display: flex; flex-direction: column; gap: 6px;
  }
  .st .greet-block {
    border: 2px solid var(--ink); padding: 18px; margin-bottom: 24px; background: #fff;
    position: relative;
  }
  .st .greet-block .sticker {
    position: absolute; top: -10px; right: -10px; background: var(--magenta); color: #fff;
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em; padding: 5px 9px; transform: rotate(6deg);
  }
  .st .greet-block .hi { font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
  .st .greet-block .who { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; margin-top: 4px; line-height: 1.1; letter-spacing: -0.01em; }
  .st .greet-block .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 8px; }

  .st .nav-section-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); padding: 0 12px; margin: 14px 0 6px; }
  .st .snav-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; font-size: 14px;
    color: var(--ink); border: 2px solid transparent; font-weight: 500;
  }
  .st .snav-item .ic { width: 16px; height: 16px; flex: none; }
  .st .snav-item .num { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
  .st .snav-item:hover { background: #fff; border-color: var(--ink); }
  .st .snav-item.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .st .snav-item.active .num { color: var(--magenta); }
  .st .logout {
    margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 11px 12px;
    font-size: 13px; color: var(--magenta); font-weight: 600;
    border-top: 1px dashed var(--ink); padding-top: 18px;
  }

  .st .main { padding: 40px 48px; }
  .st .page-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--magenta); font-weight: 600; }
  .st .page-h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 56px; line-height: 1; letter-spacing: -0.03em; margin: 8px 0; }
  .st .page-h1 em { font-style: italic; color: var(--magenta); font-weight: 400; }

  .st .grid-row { display: grid; gap: 16px; margin-top: 20px; }
  .st .row-1212 { grid-template-columns: 2fr 1fr 1fr; }
  .st .row-12 { grid-template-columns: 1.4fr 1fr; }
  .st .row-2c { grid-template-columns: 1fr 1fr; }

  .st .card {
    background: #fff; border: 2px solid var(--ink); padding: 24px; position: relative;
  }
  .st .card.pink { background: var(--magenta-soft); }
  .st .card.dark { background: var(--ink); color: var(--cream); }
  .st .card-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .st .card.dark .card-eyebrow { color: rgba(250,246,239,0.6); }
  .st .card h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; margin: 8px 0 4px; line-height: 1.15; letter-spacing: -0.01em; }
  .st .card.dark h3 { color: var(--cream); }
  .st .card .big-num { font-family: 'Fraunces', serif; font-weight: 500; font-size: 48px; line-height: 1; letter-spacing: -0.03em; margin: 6px 0; }
  .st .corner-tag {
    position: absolute; top: -12px; left: -12px; background: var(--magenta); color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.12em; padding: 5px 9px; transform: rotate(-4deg);
  }

  /* Sticker order tracker */
  .st .tracker-card {
    background: var(--ink); color: var(--cream); border: 2px solid var(--ink);
    padding: 28px; position: relative; overflow: hidden;
  }
  .st .tracker-card::after {
    content: 'IN TRANSIT'; position: absolute; top: 18px; right: -36px; transform: rotate(35deg);
    background: var(--magenta); color: #fff; padding: 5px 44px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
  }
  .st .tracker-card .order-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: .65; letter-spacing: 0.08em; }
  .st .tracker-card .pname { font-family: 'Fraunces', serif; font-weight: 500; font-size: 28px; margin: 6px 0; line-height: 1.15; max-width: 340px; }
  .st .tracker-card .arrival { font-size: 13px; opacity: .75; }
  .st .tracker-card .arrival b { color: var(--magenta); font-weight: 500; }
  .st .stops { display: flex; margin-top: 24px; gap: 8px; }
  .st .stops .stop { flex: 1; }
  .st .stops .lab { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; opacity: .6; margin-bottom: 8px; }
  .st .stops .stop.active .lab { color: var(--magenta); opacity: 1; font-weight: 600; }
  .st .stops .bar { height: 4px; background: rgba(255,255,255,0.2); position: relative; }
