<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Genzee Jewels — Theme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="home.jsx"></script>
  <script type="text/babel" src="collection.jsx"></script>
  <script type="text/babel" src="pdp.jsx"></script>
  <script type="text/babel" src="other-pages.jsx"></script>
  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection id="home" title="Homepage" subtitle="Editorial hero + impulse zone + bestsellers">
            <DCArtboard id="home-desktop" label="Home · Desktop" width={1440} height={4400}>
              <HomePage/>
            </DCArtboard>
          </DCSection>

          <DCSection id="collection" title="Collection / Category" subtitle="Earrings listing — filters, promo cards, pagination">
            <DCArtboard id="collection-desktop" label="Earrings · Desktop" width={1440} height={2400}>
              <CollectionPage/>
            </DCArtboard>
          </DCSection>

          <DCSection id="pdp" title="Product Detail Page" subtitle="Buy box, bundles, reviews, sticky CTA bar">
            <DCArtboard id="pdp-desktop" label="PDP · Butter Heart Huggies" width={1440} height={3000}>
              <PDPPage/>
            </DCArtboard>
          </DCSection>

          <DCSection id="cart" title="Cart Drawer" subtitle="Free-ship progress, combo upsell, coupon stack">
            <DCArtboard id="cart-desktop" label="Cart Drawer · Open" width={1440} height={900}>
              <CartDrawerPage/>
            </DCArtboard>
          </DCSection>

          <DCSection id="search" title="Search Results" subtitle="Query 'gold hoops' — chips, suggestions, zero-state fallback">
            <DCArtboard id="search-desktop" label="Search · Desktop" width={1440} height={1800}>
              <SearchPage/>
            </DCArtboard>
          </DCSection>

          <DCSection id="lookbook" title="Lookbook" subtitle="Shoppable editorial looks — add whole look to cart">
            <DCArtboard id="lookbook-desktop" label="Lookbook · Desktop" width={1440} height={2800}>
              <LookbookPage/>
            </DCArtboard>
          </DCSection>

          <DCSection id="about" title="About / Story" subtitle="Founder story, values, press strip">
            <DCArtboard id="about-desktop" label="About · Desktop" width={1440} height={2400}>
              <AboutPage/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
